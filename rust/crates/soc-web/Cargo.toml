[package]
publish = false  # private kiosk crate; never goes to crates.io (enables deny.toml allow-wildcard-paths)
name = "soc-web"
description = "p2soc web layer: login-script injection, navigation/tracker policy, status cards and the Chromium (CDP) panel engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
soc-core.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# Websocket client for the DevTools Protocol. Loopback only, so no TLS stack.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[lints]
workspace = true
