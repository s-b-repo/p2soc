# Fixture A: the shape of config/panels.yaml — 2x2, one tunnelled chromium panel.
display: {auto: true, width: 1920, height: 1080, cols: 2, rows: 2, gap: 0, layout: auto}
panels:
  - {id: p1, engine: webkit, grid: [0, 0], mode: direct, url: "http://192.168.1.50:3000/login"}
  - {id: p2, engine: webkit, grid: [1, 0], mode: direct, url: "http://192.168.1.60:8080/login"}
  - id: p3
    engine: chromium
    grid: [0, 1]
    mode: tunnel
    tunnel: {local_port: 19103, remote_host: 10.20.0.7, remote_port: 8443}
    path: "/login"
  - {id: p4, engine: webkit, grid: [1, 1], mode: direct, url: "http://192.168.1.70:9000/login"}
tunnel:
  enabled: true
  jump_host: "tunneluser@jump.example.net"
  identity: "/etc/soc-display/keys/tunnel_ed25519"
  extra_forwards: []
  host_key_checking: "yes"
  known_hosts: "/etc/soc-display/keys/known_hosts"
