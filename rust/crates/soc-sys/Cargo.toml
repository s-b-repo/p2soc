[package]
publish = false  # private kiosk crate; never goes to crates.io (enables deny.toml allow-wildcard-paths)
name = "soc-sys"
description = "p2soc system layer: config locations, hardware profile, health, privileged actions, tunnel/WM argv, tarpit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
soc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
# Safe wrappers for the syscalls the system tools need, so the crate carries
# no `unsafe` of its own: rustix for ids/permissions/privilege-drop, and
# signal-hook's flag registration for the tarpit's signal handling.
rustix = { version = "1", features = ["fs", "process"] }
signal-hook = { version = "0.3", default-features = false }

[lints]
workspace = true
