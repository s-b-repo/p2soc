# Fuzz targets (cargo-fuzz / libFuzzer). Kept out of the main workspace: they
# need nightly and are only built by the `fuzz` CI job.
[package]
name = "soc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
soc-core = { path = "../crates/soc-core" }

[profile.release]
debug = 1

[[bin]]
name = "config_load"
path = "fuzz_targets/config_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_split"
path = "fuzz_targets/url_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guards"
path = "fuzz_targets/guards.rs"
test = false
doc = false
bench = false
